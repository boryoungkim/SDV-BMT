# PROVISIONAL capture plan D3 (2026-11-17): deviation from guide Step 6 ("copy the GPU capture plan, asap").
# Changes vs deeplabv3plus-r50-eagle-n-bf16-capture.yaml: experiment_id; replay asap -> fixed_rate 0.25 Hz;
# request_timeout_ns and drain_ns 1 s -> 4 s.
# Reason 1 (watchdog): the SDV-BMT measure watchdog (src/sdv_bmt/dut/native.py run_window, unchanged) allows 154 s for the
#   whole asap window; with fixed_rate the schedule span is added: 1996.002 + 4 + 32 x 4 + 120 = 2248 s.
# Reason 2 (timeout): one R-50 request takes longer than the 1 s request timeout of the GPU copy.
# Period >= 1.25 x the maximum run time of one request; outputs do not depend on the rate.
# Used for the evidence of 2026-11-17. For main, use deeplabv3plus-r50-eagle-n-bf16-capture-asap-t60.yaml
# (see tools/eagle_n/README.md, watchdog section).
schema_version: 1
experiment_id: deeplabv3plus-r50-eagle-n-bf16-capture-provisional-0p25hz
execution_kind: actual
seed: 0
repetitions: 1
input: ../inputs/cityscapes-val500.yaml
workload: ../workloads/deeplabv3plus-r50-cityscapes-v1-eagle-n-bf16.yaml
dut: ../duts/eagle-n-r50-bf16.yaml
stress:
  spec: ../stress/fake-virtual-axis.yaml
  level: none
replay:
  mode: fixed_rate
  rate_hz: 0.25
  lead_ns: 2000000
run:
  max_inflight: 1
  queue_capacity: 0
  on_full: drop_new
  request_timeout_ns: 4000000000
  drain_ns: 4000000000
  output_capture: task_output_all
  on_request_error: continue
realtime:
  cpu_affinity:
  - 0
  - 1
  - 2
  - 3
  wait_policy: spin
  precondition_requests: 32
