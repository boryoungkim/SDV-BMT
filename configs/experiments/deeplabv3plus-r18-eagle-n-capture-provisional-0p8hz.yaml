# PROVISIONAL capture plan D1 (2026-11-15): deviation from guide Step 6 ("copy the GPU capture plan, asap").
# Only change vs deeplabv3plus-r18-eagle-n-capture.yaml: experiment_id and replay asap -> fixed_rate 0.8 Hz.
# Reason: the SDV-BMT measure watchdog (src/sdv_bmt/dut/native.py run_window, unchanged) allows 154 s for the whole
# asap window; with fixed_rate the schedule span is added: 623.75 + 1 + 32 + 120 = 776.75 s.
# Period 1.25 s >= 1.25 x the maximum run time of one request, so no drops.
# Used for the evidence of 2026-11-15. For main, use deeplabv3plus-r18-eagle-n-capture-asap-t60.yaml
# (see tools/eagle_n/README.md, watchdog section).
schema_version: 1
experiment_id: deeplabv3plus-r18-eagle-n-capture-provisional-0p8hz
execution_kind: actual
seed: 0
repetitions: 1
input: ../inputs/cityscapes-val500.yaml
workload: ../workloads/deeplabv3plus-r18-cityscapes-v1-eagle-n.yaml
dut: ../duts/eagle-n-r18.yaml
stress:
  spec: ../stress/fake-virtual-axis.yaml
  level: none
replay:
  mode: fixed_rate
  rate_hz: 0.8
  lead_ns: 2000000
run:
  max_inflight: 1
  queue_capacity: 0
  on_full: drop_new
  request_timeout_ns: 1000000000
  drain_ns: 1000000000
  output_capture: task_output_all
  on_request_error: continue
realtime:
  cpu_affinity:
  - 0
  - 1
  - 2
  - 3
  wait_policy: spin
  precondition_requests: 32
