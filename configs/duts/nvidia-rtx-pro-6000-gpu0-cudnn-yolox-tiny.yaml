# v0.1.2 YOLOX family (ACTUAL): GPU 0 executing the YOLOX-Tiny cuDNN plan with a pinned algorithm table
# (cuDNN 9.1.0, approved 2026-10-08). The runner fails DUT.prepare if cuDNN rejects a pinned entry, and
# records the heuristic's own choice next to it. Prepared inputs in pinned host memory (per-request H2D
# inside DUT-service), CUDA-event segment timing, frequency probe (20000 SM cycles) first in each request.
# Same runtime options as nvidia-rtx-pro-6000-gpu0-cudnn-yolox-s.yaml; only the algorithm table differs.
schema_version: 1
dut_config_id: nvidia-rtx-pro-6000-gpu0-cudnn-yolox-tiny
adapter: nvidia_cuda
device: GPU-f3e03bfa-61ab-acdf-0834-450de8becefc
max_inflight: 1
runtime_options:
  residency: host_pinned
  instrumentation: cuda_events
  context_sched: blocking_sync
  cudnn:
    math_type: default
    algo_policy: pinned
    workspace_limit_bytes: 268435456
    # (algorithm, math type) per convolution in plan order, cuDNN 9.1.0 enum values:
    # 1 = IMPLICIT_PRECOMP_GEMM, 7 = WINOGRAD_NONFUSED; math type 0 = CUDNN_DEFAULT_MATH.
    # Obtained from the heuristic policy (cudnnGetConvolutionForwardAlgorithm_v7, first supported deterministic
    # result within the workspace limit) on this device and library by the yolox-tiny-algo-probe run
    # run-20261023T021617Z-d38b24a7d967; table SHA-256 0d0b5bcffdfacc57d97fda477388820cc6d454b0ad04baea3dbddd2a09fe05d2.
