# Stage 1R-G profiler cross-check configuration (ACTUAL): as nvidia-rtx-pro-6000-gpu0-nvtx, run under
# Nsight Systems (nsys profile --trace=cuda,nvtx). The native runner fails DUT.prepare unless a profiler
# injection environment is actually present. A separate measurement configuration: never compared as
# equivalent to a run without the profiler.
schema_version: 1
dut_config_id: nvidia-rtx-pro-6000-gpu0-nsys
adapter: nvidia_cuda
device: GPU-f3e03bfa-61ab-acdf-0834-450de8becefc
max_inflight: 1
runtime_options:
  residency: host_pinned
  instrumentation: cuda_events
  context_sched: blocking_sync
  nvtx: true
  profiler: nsys
