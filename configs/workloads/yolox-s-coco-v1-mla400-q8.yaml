# YOLOX NPU port (ACTUAL, Mobilint MLA400): YOLOX-S, the same model artifact as yolox-s-coco-v1.yaml (Megvii
# YOLOX release 0.1.1rc0, artifact_sha256 = SHA-256 of yolox_s.onnx), compiled for the ARIES NPU (aries-rb) by
# qbcompiler 1.4.1 with the vendor default 8-bit quantization, calibrated on 100 COCO train2017 images (seed 0,
# disjoint from the evaluation subset, canonical preprocessing; tools/mobilint/make_calib.py).
# The compiled graph ends at the nine head convolutions (tools/mobilint/cut_head.py): the weight-free head tail
# (sigmoid on objectness and classes, concat) runs on the host in the backend's collect().
# Same preprocess, postprocess, codec and raw output contract
# (8400 x 85 float32) as the GPU workload.
# The compiled model is not committed: mxq is a host path, pinned by mxq_sha256. Workload id naming rule pending.
